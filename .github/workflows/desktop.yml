name: Desktop app

# Builds the Windows installer and portable .exe on a Windows runner (packaging for
# Windows needs Windows tooling). Download them from the run's "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['src/**', 'electron/**', 'public/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: openPulse-windows
          path: |
            release/*.exe
          if-no-files-found: error
