name: Desktop app

# Builds the Windows installer and portable .exe on a Windows runner (packaging for
# Windows needs Windows tooling). Download them from the run's "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['src/**', 'electron/**', 'public/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The native Windows Bluetooth binding (prebuilt N-API) must load on Windows.
      - run: node -e "require('@stoprocent/noble/lib/resolve-bindings')('win'); console.log('native BLE binding ok')"
      - run: npm run typecheck
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Native binding is in the package
        shell: bash
        run: test -f "release/win-unpacked/resources/app.asar.unpacked/node_modules/@stoprocent/noble/prebuilds/win32-x64/node.napi.node"
      - uses: actions/upload-artifact@v4
        with:
          name: openPulse-windows
          path: |
            release/*.exe
          if-no-files-found: error
